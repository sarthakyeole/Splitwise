{% extends "base.html" %}

{% block title %}Online Payment{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header fw-bold">
      Online Settlement
    </div>

    <div class="card-body">
      <p class="mb-2">
        <strong>Paying:</strong> ₹{{ amount }}
      </p>

      <p class="mb-3">
        <strong>To:</strong> {{ paid_to.username }}
      </p>

      <button id="pay-btn" class="btn btn-primary w-100">
        💳 Pay with Razorpay
      </button>

      <p class="text-muted small mt-3 text-center">
        Secure payment powered by Razorpay (Test Mode)
      </p>
    </div>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
  var amountPaise = JSON.parse("{{ amount_paise }}");
  var razorpayKey = "{{ razorpay_key }}";
  var orderId = "{{ order_id }}";
  var userName = "{{ request.user.username }}";
  var successUrl = "{% url 'settlement_payment_success' %}";

  var options = {
    "key": razorpayKey,
    "amount": amountPaise,
    "currency": "INR",
    "name": "Splitwise",
    "description": "Group Settlement Payment",
    "order_id": orderId,

    "handler": function (response) {
      window.location.href =
        successUrl +
        "?razorpay_payment_id=" + response.razorpay_payment_id +
        "&razorpay_order_id=" + response.razorpay_order_id +
        "&razorpay_signature=" + response.razorpay_signature;
    },

    "prefill": {
      "name": userName,
    },

    "theme": {
      "color": "#0d6efd"
    }
  };

  var rzp = new Razorpay(options);

  rzp.on('payment.failed', function (response) {
    alert("Payment failed: " + response.error.description + ". Please try again.");
  });

  document.getElementById("pay-btn").onclick = function (e) {
    e.preventDefault();
    this.disabled = true;
    this.textContent = "Processing...";
    rzp.open();
    var btn = this;
    setTimeout(function() {
      btn.disabled = false;
      btn.textContent = "💳 Pay with Razorpay";
    }, 2000);
  };
</script>
{% endblock %}
